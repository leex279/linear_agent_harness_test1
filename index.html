<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .timer-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Progress Ring */
        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring-background {
            fill: none;
            stroke: #2a2a2a;
            stroke-width: 8;
        }

        .progress-ring-circle {
            fill: none;
            stroke: #ff6347;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }

        /* Timer Display */
        .timer-display {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #ffffff;
            z-index: 1;
            position: relative;
            font-variant-numeric: tabular-nums;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .timer-wrapper {
                width: 250px;
                height: 250px;
            }

            .timer-display {
                font-size: 56px;
            }
        }

        @media (max-width: 360px) {
            .timer-wrapper {
                width: 200px;
                height: 200px;
            }

            .timer-display {
                font-size: 48px;
            }
        }

        /* Focus mode - subtle glow effect */
        .timer-display {
            text-shadow: 0 0 20px rgba(255, 99, 71, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-wrapper">
            <!-- SVG Progress Ring -->
            <svg class="progress-ring" viewBox="0 0 300 300">
                <!-- Background circle -->
                <circle
                    class="progress-ring-background"
                    cx="150"
                    cy="150"
                    r="140"
                />
                <!-- Progress circle -->
                <circle
                    class="progress-ring-circle"
                    cx="150"
                    cy="150"
                    r="140"
                    id="progress-circle"
                />
            </svg>

            <!-- Timer Display -->
            <div class="timer-display" id="timer-display">25:00</div>
        </div>
    </div>

    <script>
        // Initialize timer
        const timerDisplay = document.getElementById('timer-display');
        const progressCircle = document.getElementById('progress-circle');

        // Calculate circle circumference for progress animation
        const radius = 140;
        const circumference = 2 * Math.PI * radius;

        // Set up the circle
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = '0';

        // Initial state: 25 minutes (1500 seconds)
        const POMODORO_DURATION = 25 * 60; // 25 minutes in seconds
        let timeRemaining = POMODORO_DURATION;

        // Format time for display (MM:SS)
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update progress ring based on time remaining
        function updateProgress(timeRemaining, totalTime) {
            const progress = timeRemaining / totalTime;
            const offset = circumference * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;
        }

        // Initialize display
        timerDisplay.textContent = formatTime(timeRemaining);
        updateProgress(timeRemaining, POMODORO_DURATION);
    </script>
</body>
</html>
